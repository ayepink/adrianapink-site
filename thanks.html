<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you — Adriana Pink</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FF55AA">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { background: var(--cream); }
    .thanks { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 3rem 1.5rem; }
    .thanks h1 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(2.4rem, 6vw, 4rem); color: var(--navy); margin-bottom: 1rem; }
    .thanks h1 em { color: var(--rose); }
    .thanks p { color: var(--muted); max-width: 32rem; line-height: 1.8; margin-bottom: 2rem; }
    .thanks .links { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main class="thanks">
    <h1>Thank <em>you.</em></h1>
    <p>Your message is in. I read every note personally and will get back to you soon.</p>
    <div class="links">
      <a href="/index.html" class="btn btn-dark">Back home</a>
      <a href="https://substack.com/@adrianapink" class="btn btn-outline">Read my Substack ↗</a>
    </div>
  </main>
</body>
</html>
